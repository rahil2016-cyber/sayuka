<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <!-- Transparent background for navbar embedding -->
  <g transform="translate(10, 10)">
    <!-- Butterfly wing outline left -->
    <path d="M 120,60 C 40,-15 -10,30 -5,100 C 0,145 55,160 110,140 C 40,165 -10,190 0,250 C 10,300 95,295 145,220" fill="none" stroke="#e6a850" stroke-width="6" stroke-linecap="round" />
    <path d="M 120,60 C 85,85 75,130 115,140" fill="none" stroke="#e6a850" stroke-width="4" />
    
    <!-- Antennas -->
    <path d="M 145,55 Q 155,30 162,24" fill="none" stroke="#e6a850" stroke-width="4" stroke-linecap="round" />
    <circle cx="162" cy="22" r="4" fill="#e6a850" />
    <path d="M 152,58 Q 168,40 175,34" fill="none" stroke="#e6a850" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="175" cy="32" r="3" fill="#e6a850" />

    <!-- Styled Large 'S' intertwined with butterfly -->
    <path d="M 195,55 C 150,55 138,95 145,130 C 152,160 195,165 195,200 C 195,240 148,245 130,220" fill="none" stroke="#e6a850" stroke-width="9" stroke-linecap="round" />
    
    <!-- SAYUKA Text (White #ffffff) -->
    <text x="185" y="172" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="4">AYUKA</text>
    
    <!-- JEWELLERY Subtext (White #ffffff) -->
    <text x="255" y="222" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#ffffff" letter-spacing="9">JEWELLERY</text>
    
    <!-- Tagline (Gold #e6a850 italic) -->
    <text x="275" y="258" font-family="'Brush Script MT', 'Dancing Script', cursive, serif" font-style="italic" font-size="30" fill="#e6a850">Wear it with Joy!</text>
  </g>
</svg>
