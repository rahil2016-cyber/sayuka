<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 170" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,400&amp;family=Great+Vibes&amp;display=swap');
      .brand-ayuka {
        font-family: 'Playfair Display', 'Cinzel', Georgia, serif;
        font-weight: 900;
        font-size: 52px;
        fill: #FFFFFF;
        letter-spacing: 2px;
      }
      .brand-jewellery {
        font-family: 'Playfair Display', 'Cinzel', Georgia, serif;
        font-weight: 800;
        font-size: 22px;
        fill: #FFFFFF;
        letter-spacing: 5px;
      }
      .brand-tagline {
        font-family: 'Great Vibes', 'Dancing Script', 'Brush Script MT', cursive;
        font-size: 26px;
        fill: #F5B833;
      }
    </style>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Antennae strokes -->
    <line x1="138" y1="28" x2="145" y2="16" stroke="#F5B833" stroke-width="3.5" stroke-linecap="round" />
    <line x1="148" y1="32" x2="157" y2="20" stroke="#F5B833" stroke-width="3.5" stroke-linecap="round" />

    <!-- Butterfly S Outer Wings -->
    <!-- Top Wing -->
    <path d="M 160 38 
             C 110 12, 45 15, 32 60 
             C 20 100, 65 118, 125 98 
             C 145 92, 162 72, 160 38 Z" 
          fill="none" 
          stroke="#F5B833" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Inner Top Wing Curve -->
    <path d="M 148 44 C 115 28, 65 32, 52 65 C 44 88, 75 102, 115 88" 
          fill="none" 
          stroke="#F5B833" 
          stroke-width="3.5" 
          stroke-linecap="round" />

    <!-- Bottom Wing -->
    <path d="M 115 95 
             C 60 108, 25 125, 32 152 
             C 40 182, 105 180, 155 135 
             C 172 120, 160 98, 115 95 Z" 
          fill="none" 
          stroke="#F5B833" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Inner Bottom Wing Curve -->
    <path d="M 108 105 C 68 116, 45 128, 50 148 C 55 168, 102 165, 138 132" 
          fill="none" 
          stroke="#F5B833" 
          stroke-width="3.5" 
          stroke-linecap="round" />

    <!-- Main Stylized S Spine / Flow Line -->
    <path d="M 162 36 
             C 95 10, 20 30, 18 75 
             C 15 115, 80 115, 120 102 
             C 45 120, 15 135, 22 165 
             C 30 198, 120 190, 160 135" 
          fill="none" 
          stroke="#F5B833" 
          stroke-width="6.5" 
          stroke-linecap="round" />

    <!-- Typography Group -->
    <g transform="translate(170, 0)">
      <!-- AYUKA -->
      <text x="0" y="72" class="brand-ayuka">AYUKA</text>

      <!-- JEWELLERY -->
      <text x="5" y="110" class="brand-jewellery">JEWELLERY</text>

      <!-- Tagline -->
      <text x="25" y="145" class="brand-tagline">Wear it with Joy!</text>
    </g>
  </g>
</svg>
